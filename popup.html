<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QRadar N/A Toggle</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      width: 220px;
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 13px;
      margin: 0 0 10px 0;
      color: #222;
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #333;
      cursor: pointer;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }
    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #888;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Hide N/A Event Rows</h1>
  <label>
    <span>Hide disabled rows</span>
    <input type="checkbox" id="toggle">
  </label>
  <div class="status" id="status">Applies to the current QRadar tab.</div>
  <div class="footer">
    Shortcut: Alt+Shift+H &middot; <a href="#" id="openOptions">Configure QRadar host</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
