<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QRadar N/A Toggle - Settings</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      max-width: 420px;
      padding: 20px;
      color: #222;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
    }
    p.hint {
      font-size: 12px;
      color: #666;
      margin: 0 0 16px 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      font-size: 13px;
      padding: 6px 14px;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:hover {
      background: #ececec;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
    }
    .shortcut {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #555;
    }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>QRadar host</h1>
  <p class="hint">Enter the hostname (or IP) of your QRadar console. The extension only runs there.</p>

  <label for="host">QRadar console address</label>
  <input type="text" id="host" placeholder="e.g. qradar.mycompany.com or 172.16.100.2">
  <div>
    <button id="save">Save &amp; grant access</button>
  </div>
  <div class="status" id="status"></div>

  <div class="shortcut">
    Keyboard shortcut: toggle N/A rows with <strong>Alt+Shift+H</strong> (change it at
    <a href="chrome://extensions/shortcuts" target="_blank" rel="noopener">chrome://extensions/shortcuts</a>).
  </div>

  <script src="options.js"></script>
</body>
</html>
